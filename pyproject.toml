[project]
name = "metatraffic"
version = "0.3.0"
description = "Procedural 3D city simulator and reinforcement-learning environments for autonomous driving and multi-agent traffic (MuJoCo, Isaac Sim)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT AND LGPL-3.0-only" }  # LGPL-3.0 for mapgen/ (port of MapGenerator); see LICENSE
authors = [{ name = "Yang Liu" }]
keywords = ["reinforcement-learning", "simulation", "autonomous-driving", "multi-agent", "mujoco", "isaac-sim", "procedural-generation", "traffic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "shapely>=2.1", "pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/YangLiu68/MetaTraffic"

[project.optional-dependencies]
mujoco = ["mujoco>=3.2", "gymnasium>=0.29"]
learn = ["torch>=2.2", "torchvision>=0.17", "gymnasium>=0.29"]
isaac = ["usd-core>=24.0"]
assets = ["trimesh>=4.0"]
dev = ["pytest>=8", "ruff>=0.5"]
all = ["metatraffic[mujoco,learn,isaac,assets,dev]"]

[project.scripts]
metatraffic3d = "metatraffic3d.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mapgen*", "metatraffic3d*"]

[tool.setuptools.package-data]
"metatraffic3d.assets" = ["polypizza_manifest.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "mapgen/tests"]
markers = ["slow: needs MuJoCo rendering or takes > 20 s"]
